<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Classroom</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 px-6 py-4 flex gap-4 items-center">
  <a href="/" class="text-sky-400">Desk</a>
  <h1 class="text-xl font-semibold">Classroom</h1>
</header>
<main class="p-6 max-w-6xl mx-auto">
  <p class="text-slate-400 mb-3">Moodle is the daily classroom. MagiMDM records hours and outcomes. Same box, port 8888. Full SSO is a Moodle auth plugin later; for now use the Moodle site login (set the same admin password by hand).</p>
  <p class="mb-4"><a id="moodle-open" class="bg-indigo-700 rounded-lg px-4 py-2 inline-block" href="#">Open Moodle in a new tab</a></p>
  <iframe id="moodle-frame" class="w-full rounded-xl border border-slate-800 bg-slate-900" style="height:70vh" src="about:blank"></iframe>
</main>
<script>
  const url = 'http://' + location.hostname + ':8888';
  document.getElementById('moodle-open').href = url;
  document.getElementById('moodle-frame').src = url;
</script>
</body>
</html>
