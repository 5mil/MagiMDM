# Fallback if ECR Bitnami pull fails.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - pg:/var/lib/postgresql/data

  moodle:
    image: erseco/alpine-moodle:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      SITE_URL: http://192.168.50.143:8888
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ChangeMeMoodle1
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      - postgres

volumes:
  pg:
  moodledata:
