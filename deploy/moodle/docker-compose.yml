services:
  db:
    image: docker.io/bitnami/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_USER: bn_moodle
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme-moodle-db}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme-moodle-root}
    volumes:
      - moodle_db:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "health-check.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 12

  moodle:
    image: docker.io/bitnami/moodle:4.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_NAME: bitnami_moodle
      MOODLE_DATABASE_PASSWORD: ${MARIADB_PASSWORD:-changeme-moodle-db}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-changeme-moodle}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@localhost}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-MagiMDM Learn}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_moodledata:/bitnami/moodledata
    depends_on:
      db:
        condition: service_healthy

volumes:
  moodle_db:
  moodle_data:
  moodle_moodledata:
