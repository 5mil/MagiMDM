# Bitnami images on Docker Hub are gone for anonymous pulls.
# Use AWS public ECR tags instead.
services:
  mariadb:
    image: public.ecr.aws/bitnami/mariadb:11.4
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_USER: bn_moodle
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-moodle}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb

  moodle:
    image: ${MOODLE_IMAGE:-public.ecr.aws/bitnami/moodle:5.2.0-debian-12-r4}
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: "3306"
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_NAME: bitnami_moodle
      MOODLE_DATABASE_PASSWORD: ${MARIADB_PASSWORD:-moodle}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-ChangeMeMoodle1}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@localhost}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-MagiMDM Learn}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  moodle_data:
  moodledata_data:
