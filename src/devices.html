<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Devices — MagiMDM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-100">
<div class="max-w-5xl mx-auto px-6 py-8">
  <p class="text-sm text-slate-500 mb-2"><a class="text-sky-400" href="/">Desk</a> / Devices</p>
  <div class="flex justify-between items-end mb-6">
    <div>
      <h1 class="text-3xl font-semibold">Devices</h1>
      <p class="text-slate-400">1–10 household devices. Last-seen comes from agent poll.</p>
    </div>
    <a href="/enroll/pc" class="rounded-full bg-sky-500 text-slate-950 px-4 py-2 text-sm font-medium">Add device</a>
  </div>
  <div id="list" class="rounded-2xl border border-slate-800 overflow-hidden">
    <p class="p-6 text-slate-400 text-sm">Loading…</p>
  </div>
  <details class="mt-6 text-sm text-slate-400">
    <summary class="cursor-pointer text-slate-200">Advanced</summary>
    <p class="mt-2">GET /api/parent/devices · POST /api/agent/enroll · POST /api/agent/poll</p>
  </details>
</div>
<script>
fetch('/api/parent/devices', {credentials:'same-origin'})
  .then(r => r.json())
  .then(j => {
    const d = j.devices || [];
    const el = document.getElementById('list');
    if (!d.length) {
      el.innerHTML = '<div class="p-8 text-center text-slate-400">Nothing enrolled. <a class="text-sky-400" href="/enroll/pc">Create a token</a>.</div>';
      return;
    }
    el.innerHTML = '<table class="w-full text-sm"><thead class="text-left text-slate-500 border-b border-slate-800"><tr><th class="p-3">Name</th><th>Platform</th><th>Status</th><th>Last seen</th></tr></thead><tbody>' +
      d.map(x => '<tr class="border-t border-slate-800"><td class="p-3">' + (x.name||x.uuid||'') + '</td><td>' + (x.platform||'') + '</td><td>' + (x.status||'') + '</td><td>' + (x.last_seen_at||'—') + '</td></tr>').join('') +
      '</tbody></table>';
  })
  .catch(() => { document.getElementById('list').textContent = 'Could not load devices.'; });
</script>
</body></html>
